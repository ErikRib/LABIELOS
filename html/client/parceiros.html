<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Parceiros</title>

  <link rel="stylesheet" href="/css/style.css">

  <link rel="stylesheet" href="/css/components/navbar.css">
  <link rel="stylesheet" href="/css/components/buttons.css">
  <link rel="stylesheet" href="/css/components/badges.css">
  <link rel="stylesheet" href="/css/components/table.css">
  <link rel="stylesheet" href="/css/components/modal.css">

  <link rel="stylesheet" href="/css/components/forms.css">
  <link rel="stylesheet" href="/css/pages/parceiros.css">

  <link rel="icon" type="image/png" href="/content/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="/js/api.js" defer></script>
  <script src="/js/paginacao.js" defer></script>
  <script src="/js/prototipo.js" defer></script>
</head>

<body data-pagina="parceiros">
  <header>
    
    <nav class="nav-principal painel-nav" aria-label="Navegação principal">
      <a href="/html/client/index.html" title="LABIELOS" class="nav-logo"><img
          src="/content/img/logo-simples.png" alt="Logo do LABIELOS"></a>
      <ul class="nav-links" id="navLinks">
        <li><a data-pagina="inicio" href="/html/client/index.html">Início</a></li>
        <li><a data-pagina="solicitacoes" href="/html/client/solicitacoes.html">Solicitações</a></li>
        <li><a data-pagina="parceiros" href="/html/client/parceiros.html">Parceiros</a></li>
        <li><a data-pagina="materiais" href="/html/client/materiais.html">Materiais</a></li>
        <li><a data-pagina="relatorios" href="/html/client/relatorios.html">Relatórios</a></li>
      </ul>

      <div class="nav-acoes">
        <div class="nav-perfil-wrap">
          <button class="nav-perfil" type="button" aria-expanded="false" aria-haspopup="true">
            <img src="/content/img/user.png" alt="Foto de perfil do usuário">
            <span class="nav-identidade"><strong></strong><small></small></span>
            <span class="nav-seta" aria-hidden="true">▾</span>

          </button>
          <div class="perfil-menu" hidden>
            <div class="perfil-menu-identidade"><strong></strong><span></span></div>
            <a href="/html/perfil.html" class="perfil-menu-item">Meu perfil</a>
            <a href="/index.html" class="perfil-menu-item perfil-sair">Sair</a>
          </div>
        </div>
      </div>
    </nav>
    
  </header>
  <main class="painel-main">
    <section class="pagina-cabecalho">
      <div>
        <h1>Parceiros de manufatura</h1>
        <p>Os parceiros que podem aceitar suas solicitações na fila global. Veja as impressoras, os materiais que
          eles têm para doação e onde as peças são retiradas.</p>
      </div>
    </section>

    <section class="parceiros-filtros" aria-label="Filtrar parceiros">
      <div class="campo">
        <label for="buscaParceiro">Buscar</label>
        <input id="buscaParceiro" type="search" placeholder="Nome, cidade, material ou tecnologia">
      </div>
      <div class="campo">
        <label for="filtroTecnologiaParceiro">Tecnologia</label>
        <select id="filtroTecnologiaParceiro"><option value="">Todas</option></select>
      </div>
      <div class="parceiros-filtros-opcoes" role="group" aria-label="Mostrar só">
        <label class="opcao-filtro"><input type="checkbox" id="soLivres"> Com impressora livre agora</label>
        <label class="opcao-filtro"><input type="checkbox" id="soDoacao"> Com material para doação</label>
      </div>
    </section>
    <div class="barra-filtros">
      <p id="contadorParceiros" role="status"></p>
    </div>

    <section class="parceiros-grid" id="gridParceiros" aria-label="Parceiros"></section>
  </main><button class="btn-topo" id="btnTopo">↑</button>

  <dialog class="modal modal-parceiro" id="modalParceiro" aria-labelledby="tituloModalParceiro">
    <header class="modal-cabecalho">
      <div>
        <p data-parceiro-detalhe="cidade">Parceiro de manufatura</p>
        <h2 id="tituloModalParceiro" data-parceiro-detalhe="nome"></h2>
      </div><button class="modal-fechar" type="button" data-fechar-modal aria-label="Fechar">×</button>
    </header>
    <div class="modal-corpo" data-parceiro-detalhe="corpo"></div>
    <footer class="modal-acoes"><button type="button" class="btn btn-principal btn-acao" data-fechar-modal>Fechar</button></footer>
  </dialog>
</body>

</html>
