<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- CSS global e componentes reutilizados no site público -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components/navbar.css">
    <link rel="stylesheet" href="/css/components/buttons.css">
    <link rel="stylesheet" href="/css/components/accessibility.css">
    <link rel="stylesheet" href="/css/components/footer.css">

    <!-- CSS exclusivo da tela de login -->
    <link rel="stylesheet" href="/css/pages/login.css">

    <link rel="icon" type="image/png" href="/content/img/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <script src="/js/acessibilidade.js" defer></script>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script src="https://cdn.userway.org/widget.js" data-account="yhU6qPJU60" data-position="6"></script>
    <script src="/js/interface.js" defer></script>
</head>

<body>

    <!-- =========================
         ÁREA DE LOGIN
    ========================== -->
    <main class="login-pagina">

        <section class="login-container" aria-labelledby="titulo-login">

            <!-- Texto introdutório do card -->
            <div class="login-texto">
                <span class="login-tag">Acesse a plataforma</span>
                <h1 id="titulo-login">Bem-vindo(a) de volta!</h1>
                <p>Utilize suas credenciais para acessar o LABIELOS.</p>
            </div>

            <!-- Login autenticado via API. -->
            <form class="login-form" id="formLogin">

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" autocomplete="email" placeholder="nome@exemplo.com"
                        required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input id="senha" name="senha" type="password" autocomplete="current-password"
                        placeholder="Digite sua senha" required>
                </div>

                <div class="login-opcoes">
                    <label class="lembrar-login">
                        <input type="checkbox" name="lembrar">
                        <span>Lembrar de mim</span>
                    </label>

                    <a href="/html/recuperar-senha.html">Esqueci minha senha</a>
                </div>

                <button type="submit" class="btn btn-principal btn-login">Entrar</button>

                <div class="separador">
                    <span>Ou</span>
                </div>

                <a href="/html/cadastro.html" class="btn btn-secundario btn-login">Criar conta</a>

            <p id="mensagemLogin" role="status"></p>
            </form>

        </section>

    </main>

    <!-- =========================
         RODAPÉ COMPARTILHADO
    ========================== -->
    <footer class="footer-principal">
        <div class="footer-conteudo">
            <nav class="footer-links" aria-label="Links do rodapé">
                <a href="/index.html">Início</a>
                <a href="/html/contato.html">Contato</a>
                <a href="/html/termos.html">Termos de Uso</a>
                <a href="/html/privacidade.html">Política de Privacidade</a>
            </nav>
            <p class="footer-copy-outros">&copy; 2026 - LABIELOS · Todos os direitos reservados</p>
        </div>
    </footer>

<script src="/js/api.js" defer></script>
<script src="/js/login.js" defer></script>
<script src="/js/mostrar-senha.js" defer></script>
</body>

</html>
